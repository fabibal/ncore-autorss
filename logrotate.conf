# User-level logrotate (no sudo on this host). Run daily from the user crontab:
#   logrotate -s /home/fbazsa/ncore-autorss/.logrotate.state /home/fbazsa/ncore-autorss/logrotate.conf
# No copytruncate needed: every cron run is a new process that reopens the file in append
# mode, so a rename between runs loses nothing (a run in flight just finishes into the
# rotated file, which stays uncompressed for one more cycle via delaycompress).
/home/fbazsa/ncore-autorss/cron.log
/home/fbazsa/ncore-autorss/autorss.log
/home/fbazsa/ncore-autorss/torrent-manager.log
/home/fbazsa/ncore-autorss/torrent-manager-cron.log
{
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0664 fbazsa fbazsa
}
